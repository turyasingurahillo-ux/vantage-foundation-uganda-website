name: Bug report
description: Report a reproducible problem with the Vantage Foundation Uganda website
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the Vantage Foundation Uganda website. Do not include credentials, private beneficiary/donor/case information, or vulnerability details here. Security concerns should follow SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe set of steps that reproduces the issue.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Affected page or route
      placeholder: https://www.vantagefoundationuganda.com/...
  - type: textarea
    id: environment
    attributes:
      label: Browser/device or environment
      description: Include browser, device, operating system, or deployment context if relevant.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included secrets, credentials, private personal data, or safeguarding information.
          required: true
