name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint, type-check, content validation, and unit tests.
  # Runs on every push and PR — fast feedback.
  quality:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Validate content
        run: npm run validate-content

      - name: Check placeholders
        run: npm run check-placeholders

      - name: Check internal links
        run: npm run check-links

      - name: Unit tests
        run: npm test

      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

  # Production build — ensures the site compiles and all pages prerender.
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Build doesn't need a real database — pages that query the DB
          # are dynamic and won't be prerendered.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost/placeholder

  # E2E accessibility tests with axe-core.
  # Runs Playwright tests including WCAG 2.2 AA checks.
  e2e-a11y:
    name: E2E accessibility (axe-core)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost/placeholder

      - name: Run E2E accessibility tests
        run: npx playwright test tests/e2e/accessibility.spec.ts
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost/placeholder
          ADMIN_SECRET: test-secret-for-ci